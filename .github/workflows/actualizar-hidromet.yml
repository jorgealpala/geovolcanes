# Actualiza cada dia la lluvia satelital (data/hidromet/*.json) con Google Earth Engine.
# Requiere el secreto del repositorio GEE_SERVICE_ACCOUNT_KEY con el CONTENIDO del JSON
# de la cuenta de servicio (Settings > Secrets and variables > Actions > New repository secret).
# Ver docs/FLUJO_ACTUALIZACION.md, seccion 4.
name: Actualizar lluvia satelital

on:
  schedule:
    - cron: "30 11 * * *"   # 06:30 hora de Colombia
  workflow_dispatch:         # boton "Run workflow" en la pestana Actions

permissions:
  contents: write

concurrency:
  group: hidromet
  cancel-in-progress: false

jobs:
  hidromet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Earth Engine
        run: pip install "earthengine-api==1.1.2"

      - name: Calcular lluvia de todos los volcanes
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GEE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Falta el secreto GEE_SERVICE_ACCOUNT_KEY (ver docs/FLUJO_ACTUALIZACION.md)."
            exit 1
          fi
          python scripts/actualizar_hidromet.py

      - name: Validar datos
        run: python scripts/validar_datos.py

      - name: Publicar si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hidromet
          if git diff --cached --quiet; then
            echo "Sin cambios en la lluvia."
          else
            git commit -m "datos: lluvia satelital $(date -u +%F)"
            git push
          fi
